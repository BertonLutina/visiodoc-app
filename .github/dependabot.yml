# Doc : https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
# Ouvre chaque semaine des PR de mise a jour, vers la branche dev. Ne merge
# rien seul : chaque PR passe par la CI (ci.yml, secrets-scan.yml).
# Pour npm, les montees majeures d'Expo / React Native sont a faire a la main
# (alignement SDK, `npx expo install --fix`), donc ignorees ici.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
