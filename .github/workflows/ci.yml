name: CI (types et tests)

# Verifie a chaque push et pull request vers dev et main que le code compile
# (TypeScript) et que les tests Jest passent.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Types et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "yarn"

      # TODO : passer en `yarn install --frozen-lockfile` des que yarn.lock
      # aura ete regenere et committe (il n'est pas synchronise avec
      # package.json, un install strict echouerait pour l'instant).
      - name: Installer les dependances
        run: yarn install --non-interactive

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tests Jest
        run: npx jest --ci
