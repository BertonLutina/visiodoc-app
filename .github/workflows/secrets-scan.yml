name: Secrets Scan (gitleaks)

# Signale tout push ou pull request qui introduit un secret detectable
# (cles API, tokens...). Historique complet scanne.
# Doc : https://github.com/gitleaks/gitleaks-action
# Remarque : si le depot appartient a une organisation GitHub, gitleaks-action
# exige un secret GITLEAKS_LICENSE (gratuit pour un compte personnel).

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Scan du depot avec gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet pour scanner les commits)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Executer gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_SUMMARY: true
