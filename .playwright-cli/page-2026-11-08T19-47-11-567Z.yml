    - generic [ref=f49e232]:
      - generic [ref=f49e233]:
        - heading "À propos de VisioDoc" [level=2] [ref=f49e234]
        - paragraph [ref=f49e235]: Notre mission est de rendre les soins de santé accessibles à tous, partout en Afrique, grâce à la technologie et l'innovation.
      - generic [ref=f49e236]:
        - generic [ref=f49e237]:
          - heading "Notre Mission" [level=3] [ref=f49e238]
          - paragraph [ref=f49e239]: "VisioDoc est né d'une vision simple mais puissante : utiliser la technologie pour résoudre le problème critique d'accès aux soins de santé en Afrique. Nous croyons que chaque personne mérite un accès rapide et abordable à des soins médicaux de qualité."
          - paragraph [ref=f49e240]: Notre plateforme connecte les patients avec des professionnels de soins de santé qualifiés via des consultations vidéo sécurisées, éliminant les barrières géographiques et financières qui empêchent souvent l'accès aux soins.
        - generic [ref=f49e241]:
          - heading "Notre Histoire" [level=3] [ref=f49e242]
          - paragraph [ref=f49e243]: Fondée en 2023, VisioDoc est née de la constatation que des millions de personnes en RDC et dans la région n'ont pas accès à des consultations médicales rapides et abordables. Avec seulement 1 médecin pour 10 000 habitants, nous avons développé une solution qui tire parti de la forte pénétration du Mobile Money.
          - paragraph [ref=f49e244]: Aujourd'hui, nous sommes fiers de servir plus de 10 000 patients à travers 50+ villes, avec un réseau de plus de 500 médecins qualifiés. Notre taux de satisfaction de 95% témoigne de notre engagement envers l'excellence.
      - generic [ref=f49e245]:
        - heading "Nos Valeurs" [level=3] [ref=f49e246]
        - generic [ref=f49e247]:
          - generic [ref=f49e248]:
            - heading "Qualité des Soins" [level=4] [ref=f49e252]
            - paragraph [ref=f49e253]: Nous travaillons uniquement avec des professionnels de soins de santé certifiés et expérimentés pour garantir des soins de la plus haute qualité.
          - generic [ref=f49e254]:
            - heading "Sécurité & Confidentialité" [level=4] [ref=f49e258]
            - paragraph [ref=f49e259]: Vos données médicales sont protégées par un cryptage de niveau bancaire et restent strictement confidentielles.
          - generic [ref=f49e260]:
            - heading "Accessibilité" [level=4] [ref=f49e265]
            - paragraph [ref=f49e266]: Des consultations selon la disponibilité de nos professionnels de soins de santé, payables via Mobile Money, pour rendre les soins accessibles à tous.
          - generic [ref=f49e267]:
            - heading "Empathie" [level=4] [ref=f49e274]
            - paragraph [ref=f49e275]: Nous plaçons l'humain au centre de tout ce que nous faisons, avec une approche bienveillante et personnalisée.
